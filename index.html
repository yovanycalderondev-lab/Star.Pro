<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samazil</title>
    
    <!-- Ícono de la pestaña -->
    <link rel="icon" href="WhatsApp Image 2026-07-25 at 12.05.29 PM.jpeg" type="image/jpeg">
    
    <!-- Tu archivo de estilos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <!-- Puedes usar tu imagen aquí también como logo si quieres -->
            <img src="WhatsApp Image 2026-07-25 at 12.05.29 PM.jpeg" alt="Samazil Logo" width="50" style="border-radius: 5px; vertical-align: middle;">
            <h1 style="display: inline-block; margin-left: 10px;">Samazil</h1>
        </div>
        <div class="auth-buttons">
            <button id="btn-login-google">Iniciar sesión con Google</button>
            <div id="usuario-info" style="display: none;">
                <span id="nombre-usuario-header"></span>
                <button id="btn-logout">Cerrar sesión</button>
            </div>
        </div>
    </header>

    <main id="contenido-principal" style="display: none;"> <!-- Se oculta hasta que inicie sesión -->
        
        <!-- Sección del Perfil -->
        <section id="perfil-section">
            <h2>Configura tu Perfil</h2>
            <form id="perfilUsuario">
                <label for="fotoPerfil">Foto de Perfil:</label>
                <input type="file" id="fotoPerfil" accept="image/*">

                <label for="precioHora">Tarifa por Hora:</label>
                <div class="precio-input">
                    <span>Q</span>
                    <input type="number" id="precioHora" placeholder="Ej: 50" min="0" required>
                    <span>/ hora</span>
                </div>

                <button type="submit">Guardar Datos</button>
            </form>
        </section>

        <!-- Sección de Mensajes -->
        <section id="mensajes-section">
            <h2>Mensajes</h2>
            <!-- Caja donde aparecerán los mensajes -->
            <div id="chat-box" style="border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background-color: #f9f9f9;">
                <p style="color: gray; text-align: center;">Inicia la conversación...</p>
            </div>
            
            <form id="form-mensaje">
                <input type="text" id="input-mensaje" placeholder="Escribe un mensaje..." required style="width: 70%; padding: 8px;">
                <button type="submit" style="padding: 8px;">Enviar</button>
            </form>
        </section>

    </main>

    <!-- Tu archivo principal de JavaScript (IMPORTANTE: debe ser type="module" para Firebase) -->
    <script type="module" src="app.js"></script>
</body>
</html>
