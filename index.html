<!DOCTYPE html>
<html lang="es-GT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAR.PRO</title>
<meta name="description" content="Plataforma guatemalteca que conecta consumidores con emprendedores y profesionales de oficios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===================== TOPBAR ===================== -->
<header class="topbar" id="topbar">
  <div class="topbar-inner">
    <button class="brand" id="btnBrandHome" aria-label="Ir al inicio">
      <span class="brand-plate">SP</span>
      <span class="brand-text">STAR.PRO<small>GT</small></span>
    </button>
    <nav class="topbar-nav" id="topbarNav" hidden>
      <button class="nav-link" data-route="dashboard">Inicio</button>
      <button class="nav-link" data-route="catalogo">Oficios y Servicios</button>
      <button class="nav-link" data-route="mensajes">Mensajes</button>
      <button class="nav-link" data-route="perfil">Mi cuenta</button>
      <button class="nav-link nav-link--ghost" id="btnLogout">Salir</button>
    </nav>
    <div class="topbar-guest" id="topbarGuest">
      <button class="btn btn--ghost-light" data-route="login">Iniciar sesión</button>
      <button class="btn btn--accent" data-route="registro">Crear cuenta</button>
    </div>
  </div>
</header>

<main id="app"></main>

<!-- ===================== TEMPLATES ===================== -->

<template id="tpl-landing">
  <section class="hero">
    <div class="hero-bg" aria-hidden="true">
      <span class="stripe s1"></span><span class="stripe s2"></span><span class="stripe s3"></span><span class="stripe s4"></span><span class="stripe s5"></span>
    </div>
    <div class="hero-content">
      <p class="eyebrow">Plataforma de oficios y servicios · Guatemala</p>
      <h1 class="hero-title">Conectate con<br>quien lo hace<br><span class="accent-underline">bien.</span></h1>
      <p class="hero-sub">Buscá plomeros, electricistas, tutores, músicos, jardineros y más — con tarifas claras desde el primer momento, como va escrito en la placa de cada oficio.</p>
      <div class="hero-actions">
        <button class="btn btn--accent btn--lg" data-route="registro" data-tipo="consumidor">Busco un servicio</button>
        <button class="btn btn--outline-light btn--lg" data-route="registro" data-tipo="emprendedor">Ofrezco un servicio</button>
      </div>
      <p class="hero-foot">¿Ya tenés cuenta? <button class="link-inline" data-route="login">Iniciá sesión</button></p>
    </div>
  </section>

  <section class="route-strip">
    <h2 class="section-title">Rutas disponibles</h2>
    <p class="section-sub">Cada oficio tiene su propia placa de color, igual que las rutas de un camión — así lo reconocés de un vistazo.</p>
    <div class="plaque-grid" id="landingPlaques"></div>
  </section>
</template>

<template id="tpl-registro">
  <section class="auth-shell">
    <div class="auth-card">
      <h1 class="auth-title">Crear cuenta</h1>
      <div class="seg-toggle" role="tablist" aria-label="Tipo de perfil">
        <button class="seg-btn" data-tipo="consumidor" role="tab">Consumidor</button>
        <button class="seg-btn" data-tipo="emprendedor" role="tab">Emprendedor / Profesional</button>
      </div>
      <p class="auth-help" id="regHelp"></p>
      <form id="formRegistro" novalidate></form>
      <p class="auth-switch">¿Ya tenés cuenta? <button class="link-inline" data-route="login">Iniciá sesión</button></p>
    </div>
  </section>
</template>

<template id="tpl-login">
  <section class="auth-shell">
    <div class="auth-card auth-card--narrow">
      <h1 class="auth-title">Iniciar sesión</h1>
      <form id="formLogin" novalidate>
        <label class="field">
          <span>Número de teléfono</span>
          <input type="tel" name="telefono" autocomplete="tel" required>
        </label>
        <label class="field">
          <span>Contraseña</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <p class="form-error" id="loginError" hidden></p>
        <button class="btn btn--accent btn--full" type="submit">Entrar</button>
      </form>
      <p class="auth-switch">¿Sos nuevo? <button class="link-inline" data-route="registro">Creá tu cuenta</button></p>
      <p class="auth-foot-note">¿Sos administrador? <button class="link-inline link-inline--quiet" data-route="admin-login">Entrar al panel de tarifas</button></p>
    </div>
  </section>
</template>

<template id="tpl-dashboard">
  <section class="dash-head">
    <p class="eyebrow">Hola de nuevo</p>
    <h1 class="dash-title" id="dashGreeting">—</h1>
    <p class="dash-sub" id="dashSub"></p>
  </section>
  <section class="dash-actions">
    <button class="dash-card" data-route="catalogo">
      <span class="dash-card-num">01</span>
      <span class="dash-card-title">Consumidor</span>
      <span class="dash-card-text">Acceso directo para buscar servicios</span>
    </button>
    <button class="dash-card" data-route="catalogo">
      <span class="dash-card-num">02</span>
      <span class="dash-card-title">Oficios y Servicios</span>
      <span class="dash-card-text">Todas las actividades agrupadas por categoría</span>
    </button>
    <button class="dash-card" data-route="mensajes">
      <span class="dash-card-num">03</span>
      <span class="dash-card-title">Mensajes</span>
      <span class="dash-card-text">Conversaciones dentro de la plataforma</span>
    </button>
  </section>
  <section class="route-strip">
    <h2 class="section-title">Categorías</h2>
    <div class="plaque-grid" id="dashPlaques"></div>
  </section>
</template>

<template id="tpl-catalogo">
  <section class="cat-head">
    <h1 class="section-title">Oficios y Servicios</h1>
    <p class="section-sub">Elegí una categoría para ver tarifas y profesionales disponibles.</p>
  </section>
  <div class="plaque-grid" id="catalogoPlaques"></div>
</template>

<template id="tpl-categoria">
  <section class="catdetail" id="catdetailRoot"></section>
</template>

<template id="tpl-pro">
  <section class="prodetail" id="prodetailRoot"></section>
</template>

<template id="tpl-perfil">
  <section class="profile-shell" id="profileRoot"></section>
</template>

<template id="tpl-mensajes">
  <section class="msg-shell">
    <aside class="msg-list" id="msgList">
      <h2 class="section-title section-title--sm">Conversaciones</h2>
      <div id="msgThreads"></div>
    </aside>
    <div class="msg-thread" id="msgThread">
      <p class="msg-empty">Elegí una conversación o escribile a un profesional desde su perfil.</p>
    </div>
  </section>
</template>

<template id="tpl-admin-login">
  <section class="auth-shell">
    <div class="auth-card auth-card--narrow">
      <h1 class="auth-title">Panel de administración</h1>
      <p class="auth-help">Solo el administrador puede actualizar las tarifas del catálogo.</p>
      <form id="formAdminLogin" novalidate>
        <label class="field">
          <span>Usuario</span>
          <input type="text" name="user" autocomplete="username" required>
        </label>
        <label class="field">
          <span>Contraseña</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <p class="form-error" id="adminLoginError" hidden></p>
        <button class="btn btn--accent btn--full" type="submit">Entrar</button>
      </form>
    </div>
  </section>
</template>

<template id="tpl-admin">
  <section class="cat-head">
    <h1 class="section-title">Panel de tarifas</h1>
    <p class="section-sub">Edita las tarifas oficiales. Los cambios se guardan al instante para todos los usuarios de este navegador.</p>
  </section>
  <div id="adminCats" class="admin-cats"></div>
</template>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
