<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samazil</title>
    
    <!-- Ícono de la pestaña -->
    <link rel="icon" href="WhatsApp Image 2026-07-25 at 12.05.29 PM.jpeg" type="image/jpeg">
    
    <!-- Hoja de Estilos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Encabezado -->
    <header>
        <div class="logo-container">
            <img src="WhatsApp Image 2026-07-25 at 12.05.29 PM.jpeg" alt="Samazil Logo" class="logo-img">
            <h1>Samazil</h1>
        </div>
        <div id="usuario-info" style="display: none;">
            <span id="nombre-usuario-header"></span>
            <button id="btn-logout" class="btn-danger">Cerrar sesión</button>
        </div>
    </header>

    <!-- Tarjeta de Autenticación / Registro -->
    <div id="auth-container" class="card auth-card">
        <h2>Ingresar a Samazil</h2>
        <form id="form-auth">
            <div class="form-group">
                <label for="auth-nombre">Nombre completo</label>
                <input type="text" id="auth-nombre" placeholder="Ej: Carlos López" required>
            </div>
            
            <div class="form-group">
                <label for="auth-email">Correo electrónico</label>
                <input type="email" id="auth-email" placeholder="correo@ejemplo.com" required>
            </div>
            
            <div class="form-group">
                <label for="auth-password">Contraseña</label>
                <input type="password" id="auth-password" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>

            <button type="submit" id="btn-auth" class="btn-primary">Entrar / Registrarme</button>
        </form>
    </div>

    <!-- Contenido Principal (Oculto hasta iniciar sesión) -->
    <main id="contenido-principal" style="display: none;">
        
        <!-- Sección del Perfil -->
        <section id="perfil-section" class="card">
            <h2>Configura tu Perfil</h2>
            <form id="perfilUsuario">
                <div class="form-group">
                    <label for="precioHora">Tarifa por Hora</label>
                    <div class="precio-input-wrapper">
                        <span class="currency-symbol">Q</span>
                        <input type="number" id="precioHora" placeholder="Ej: 50" min="0" required>
                        <span class="unit-text">/ hora</span>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Guardar Tarifa</button>
            </form>
        </section>

        <!-- Sección de Mensajes -->
        <section id="mensajes-section" class="card">
            <h2>Mensajes</h2>
            <div id="chat-box" class="chat-container">
                <!-- Los mensajes se cargarán dinámicamente aquí -->
            </div>
            
            <form id="form-mensaje" class="chat-form">
                <input type="text" id="input-mensaje" placeholder="Escribe un mensaje..." required>
                <button type="submit" class="btn-primary">Enviar</button>
            </form>
        </section>

    </main>

    <!-- Archivo JavaScript Modular -->
    <script type="module" src="app.js"></script>
</body>
</html>
