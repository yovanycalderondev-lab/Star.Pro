<!DOCTYPE html>
<html lang="es-GT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samazil · Contrata y ofrece servicios en Guatemala</title>
  <meta name="description" content="Samazil conecta a clientes con profesionales y emprendedores de oficios en Guatemala. Tarifas claras por hora, en quetzales.">
  <link rel="icon" type="image/jpeg" href="logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand" id="btnBrandHome">
        <img src="logo.jpeg" alt="Logo Samazil" class="brand-logo-img">
        <span class="brand-text">Samazil</span>
      </button>

      <nav class="topbar-nav" id="topbarNav" hidden>
        <button class="nav-link" data-route="dashboard">Inicio</button>
        <button class="nav-link" data-route="catalogo">Servicios</button>
        <button class="nav-link" data-route="mensajes">Chat</button>
        <button class="nav-link" data-route="perfil">Mi cuenta</button>
        <button class="nav-link nav-link--ghost" id="btnLogout">Salir</button>
      </nav>

      <div class="topbar-guest" id="topbarGuest">
        <button class="btn btn--ghost-light" data-route="login">Iniciar sesión</button>
        <button class="btn btn--accent" data-route="registro">Crear cuenta</button>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>© <span id="footerYear"></span> Samazil</span>
      <button class="link-inline link-inline--quiet" data-route="terminos">Términos y condiciones</button>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
